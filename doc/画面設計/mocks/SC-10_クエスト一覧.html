<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>クエスト一覧 — ideaquest</title>
<link rel="stylesheet" href="shared.css">
<style>
  /* SC-10 固有スタイル（共通化する見た目は shared.css へ昇格する） */
  .list-main { padding-block: var(--space-6) var(--space-16); }
  .page-head { display: flex; align-items: center; justify-content: space-between; gap: var(--space-4); flex-wrap: wrap; margin-bottom: var(--space-5); }
  .page-head h1 { font-size: var(--text-2xl); margin: 0; }

  /* 専用クエストカード（SC-01 の参加中クエストカードと一貫）。DataTable の cardRaw で丸ごと描画。
     カード形式の見た目は現状維持（アクセント左帯＋クエストアイコン）。並び/絞込/切替は DataTable 標準。 */
  #questTable .dt-cards { grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
  a.quest-card { display: block; color: inherit; text-decoration: none; transition: box-shadow .15s, transform .05s, border-color .15s; }
  a.quest-card:hover { box-shadow: var(--shadow-lg); border-color: var(--color-primary-border); text-decoration: none; }
  a.quest-card:active { transform: translateY(1px); }
  .quest-card__meta { display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap; margin-top: var(--space-2); }
  .quest-card__stats { display: flex; align-items: center; gap: var(--space-4); margin-top: var(--space-3); color: var(--color-text-muted); font-size: var(--text-sm); }
  .deadline { font-size: var(--text-xs); font-weight: 500; }
  .deadline.soon { color: var(--color-danger); }

  /* リスト（テーブル）ビュー＝行クリックで詳細へ（指カーソル/ホバー背景は DataTable 標準 .dt-row--link＝§4.5 ⑪） */
  .idea-title { font-weight: 600; }
  #questTable tbody tr[data-dt-row]:hover .idea-title { color: var(--color-primary); }
</style>
</head>
<body>

<div class="app-bg" id="appBg"></div>

<header class="app-header">
  <div class="container between">
    <a class="brand" href="SC-01_ダッシュボード.html"><img class="brand-logo" src="assets/logo-ideaquest.png" alt="IDEAQUEST"></a>
    <div class="header-actions">
      <span class="pixel-stat level">Lv.7</span>
      <span class="pixel-stat coin">◆ 320</span>
      <a class="pixel-stat skill" href="SC-32_魔法スキル.html" title="スキルポイント（魔法/スキル画面へ）">✦ SP 3</a>
      <a class="bell" href="SC-02_通知一覧.html" aria-label="通知（未読3件）">🔔<span class="bell__badge">3</span></a>
      <div class="usermenu">
        <button class="usermenu__trigger" aria-haspopup="menu" aria-expanded="false">
          <span class="avatar sm" data-name="山田 太郎"><span class="avatar__img placeholder">山</span><span class="avatar__level">Lv.7</span></span>
        </button>
        <ul class="usermenu__list" role="menu" hidden>
          <li role="none"><a role="menuitem" href="#">プロフィール</a></li>
          <li role="none"><a role="menuitem" href="#">アバター / 着せ替え</a></li>
          <li role="none"><a role="menuitem" href="#">設定</a></li>
          <li role="none"><div class="usermenu__sep"></div></li>
          <li role="none"><button role="menuitem" type="button" data-bg-set>🖼️ 背景画像を変更</button></li>
          <li role="none"><button role="menuitem" type="button" data-bg-reset>背景画像をリセット</button></li>
          <li role="none"><div class="usermenu__sep"></div></li>
          <li role="none"><button role="menuitem" type="button">ログアウト</button></li>
        </ul>
      </div>
    </div>
  </div>
</header>

<main class="container list-main">
  <a class="backlink" href="SC-01_ダッシュボード.html" style="display:inline-block;margin-bottom:var(--space-3);color:var(--color-text-muted);font-size:var(--text-sm)">← ダッシュボードへ戻る</a>

  <div class="page-head">
    <h1>クエスト一覧</h1>
    <button class="btn btn-primary" type="button" id="createBtn">＋ クエストを作成</button>
  </div>
  <p class="muted text-sm" style="margin-top:calc(-1*var(--space-3));margin-bottom:var(--space-4)">「所属グループ内で作られ、かつ自分がパーティー参加中」のクエストを表示します。</p>

  <!-- 一覧操作標準（DataTable）。カードの見た目は cardRaw で専用クエストカードを維持しつつ、
       検索/絞込（状態・カテゴリー・グループ）/ソート/表示切替/CSV/行固定（ピン）等は DataTable 標準。
       専用カードでも本体HTMLは書き換えず、外側にフローティングのピンを重ねる。 -->
  <div id="questTable"></div>

  <p class="muted text-xs" style="margin-top:var(--space-6)">作成した下書きのクエストは、本人だけに一覧表示されます（下書きバッジ・グレー表示）。</p>
</main>

<script src="shared.js"></script>
<script>
  // 背景画像（ダッシュボードで設定した個人背景を全画面へ反映）
  const savedBg = localStorage.getItem('ideaquest_content_bg');
  if (savedBg) { const el = document.getElementById('appBg'); el.style.backgroundImage = 'url("' + savedBg + '")'; el.classList.add('is-set'); }

  // 参加中クエストのデータ（デモ）。accent=クエスト色（カード帯＋アイコンタイル）
  const QUESTS = [
    { id:1, title:'配送ルート最適化', theme:'配送コストとCO2削減の両立', cat:'業務改善', status:'評価中', group:'プロダクト開発部', owner:'山', char:'配', accent:'#0D9488', deadline:'2026/12/20', dl:20261220, soon:true, party:6, ideas:8, my:'未投稿', order:6 },
    { id:2, title:'社内ナレッジ検索AI', theme:'問い合わせ対応の工数を半減', cat:'新規事業', status:'選定', group:'プロダクト開発部', owner:'鈴', char:'社', accent:'#7C3AED', deadline:'2026/12/24', dl:20261224, soon:false, party:4, ideas:12, my:'投稿済み', order:5 },
    { id:3, title:'経費精算の自動化', theme:'締め作業のムダをなくす', cat:'コスト削減', status:'募集中', group:'全社改善プロジェクト', owner:'田', char:'経', accent:'#EA580C', deadline:'2027/01/10', dl:20270110, soon:false, party:5, ideas:3, my:'投稿済み', order:4 },
    { id:4, title:'顧客サポートの品質向上', theme:'一次回答の速度と満足度を上げる', cat:'顧客体験', status:'進行中', group:'全社改善プロジェクト', owner:'伊', char:'顧', accent:'#2563EB', deadline:'2026/12/28', dl:20261228, soon:false, party:7, ideas:15, my:'未投稿', order:3 },
    { id:5, title:'社内イベント活性化', theme:'部署横断の交流を増やす', cat:'業務改善', status:'完了', group:'プロダクト開発部', owner:'佐', char:'社', accent:'#DB2777', deadline:'2026/11/30', dl:20261130, soon:false, party:5, ideas:9, my:'投稿済み', order:2 },
    { id:6, title:'オフィス省エネ', theme:'電力コストと環境負荷を下げる', cat:'コスト削減', status:'募集中', group:'全社改善プロジェクト', owner:'山', char:'オ', accent:'#059669', deadline:'2027/01/20', dl:20270120, soon:false, party:3, ideas:1, my:'未投稿', order:1 },
    { id:7, title:'来客受付のデジタル化（下書き）', theme:'受付の無人化と来客体験の向上', cat:'業務改善', status:'下書き', group:'プロダクト開発部', owner:'あ', char:'来', accent:'#64748B', deadline:'—', dl:99999999, soon:false, party:0, ideas:0, my:'下書き', order:7, draft:true },
  ];

  const statusBadge = s => (s === '完了' || s === '下書き') ? 'badge badge-muted' : (s === '選定' ? 'badge badge-success' : 'badge');
  const myBadge = m => m === '未投稿' ? 'badge badge-danger' : (m === '投稿済み' ? 'badge badge-success' : 'badge badge-muted');
  // 下書きは本人だけに見え、クリックで SC-11 編集モーダル（公開クエストは SC-12 詳細）
  const questHref = x => x.draft ? 'SC-11_クエスト作成編集.html' : 'SC-12_クエスト詳細.html';
  const questIcon = q => '<span class="quest-icon sm" style="--accent:' + q.accent + '"><span class="quest-icon__char">' + q.char + '</span><span class="quest-icon__owner placeholder">' + q.owner + '</span></span>';

  // 専用クエストカード（アクセント左帯＋アイコン）＝見た目は現状維持。DataTable は cardRaw で丸ごと描画。
  const questCard = x =>
    '<a class="card card-accent quest-card" href="' + questHref(x) + '" style="--accent:' + x.accent + '">' +
      '<div class="between"><span class="row-center" style="gap:var(--space-2);min-width:0">' + questIcon(x) +
        '<span class="card-title">' + x.title + '</span></span>' +
        '<span class="' + statusBadge(x.status) + '">' + x.status + '</span></div>' +
      '<div class="quest-card__meta"><span class="badge badge-muted">' + x.cat + '</span>' +
        '<span class="deadline' + (x.soon ? ' soon' : '') + '">⏳ 締切 ' + x.deadline + '</span></div>' +
      '<div class="quest-card__stats"><span>👥 ' + x.party + '</span><span>💡 ' + x.ideas + '</span>' +
        '<span class="' + myBadge(x.my) + '">' + x.my + '</span></div>' +
    '</a>';

  // 既定＝新着順（order 降順）で渡す。以降は列見出しクリック／カード時は「並び替え」で操作。
  const DATA = QUESTS.slice().sort((a, b) => b.order - a.order);

  window.DataTable.init(document.getElementById('questTable'), {
    storageKey: 'sc10-quests',
    data: DATA,
    rowId: (x) => x.id,
    unit: '件',
    perPage: 12,
    perPageOptions: [12, 24, 48],
    defaultView: 'card',
    maxPins: 5,                                    // よく見るクエストを先頭に固定（list/card 共通・localStorage 永続）
    searchFields: '件名・テーマ・カテゴリー',
    exportName: 'クエスト一覧',
    emptyText: '該当するクエストがありません。条件を変えてお試しください。',
    onRowClick: (x) => { location.href = questHref(x); },  // リスト行クリックで詳細へ（カードは <a> で遷移）
    cardRaw: questCard,                            // カードの見た目は画面が完全制御（専用クエストカード）
    columns: [
      { key: 'title', label: 'クエスト', locked: true, width: 300, sortable: true, filter: { type: 'text' }, sortVal: (x) => x.title, searchVal: (x) => x.title + ' ' + x.theme + ' ' + x.cat, csvVal: (x) => x.title, render: (x) => '<span class="row-center" style="gap:var(--space-2)">' + questIcon(x) + '<span class="idea-title">' + x.title + '</span></span>' },
      { key: 'cat', label: 'カテゴリー', width: 130, sortable: true, filter: { type: 'enum', options: [['業務改善', '業務改善'], ['新規事業', '新規事業'], ['コスト削減', 'コスト削減'], ['顧客体験', '顧客体験']] }, sortVal: (x) => x.cat, filterVal: (x) => x.cat, render: (x) => '<span class="badge badge-muted">' + x.cat + '</span>' },
      { key: 'status', label: 'ステータス', width: 120, sortable: true, filter: { type: 'enum', options: [['下書き', '下書き'], ['募集中', '募集中'], ['進行中', '進行中'], ['評価中', '評価中'], ['選定', '選定'], ['完了', '完了']] }, sortVal: (x) => x.status, filterVal: (x) => x.status, render: (x) => '<span class="' + statusBadge(x.status) + '">' + x.status + '</span>' },
      { key: 'group', label: 'グループ', width: 170, hiddenDefault: true, sortable: true, filter: { type: 'enum', options: [['プロダクト開発部', 'プロダクト開発部'], ['全社改善プロジェクト', '全社改善プロジェクト']] }, sortVal: (x) => x.group, filterVal: (x) => x.group, csvVal: (x) => x.group, render: (x) => x.group },
      { key: 'deadline', label: '締切', width: 120, sortable: true, sortVal: (x) => x.dl, filter: { type: 'text' }, filterVal: (x) => x.deadline, csvVal: (x) => x.deadline, render: (x) => '<span class="' + (x.soon ? 'deadline soon' : '') + '">' + x.deadline + '</span>' },
      { key: 'party', label: '👥', width: 80, align: 'num', sortable: true, filter: { type: 'number' }, sortVal: (x) => x.party, filterVal: (x) => x.party, render: (x) => x.party },
      { key: 'ideas', label: '💡', width: 80, align: 'num', sortable: true, filter: { type: 'number' }, sortVal: (x) => x.ideas, filterVal: (x) => x.ideas, render: (x) => x.ideas },
      { key: 'my', label: 'あなた', width: 110, sortable: true, filter: { type: 'enum', options: [['未投稿', '未投稿'], ['投稿済み', '投稿済み'], ['下書き', '下書き']] }, sortVal: (x) => x.my, filterVal: (x) => x.my, render: (x) => '<span class="' + myBadge(x.my) + '">' + x.my + '</span>' },
    ],
  });

  document.getElementById('createBtn').addEventListener('click', () => { location.href = 'SC-11_クエスト作成編集.html'; });
</script>
</body>
</html>
