# ローカル開発用オーケストレーション（ログイン状態A スライス）
# Postgres / Redis / backend / frontend。
# MinIO / PGroonga / outbox worker / MailHog は後続スライスで追加する。
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ideaquest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ideaquest}
      POSTGRES_DB: postgres            # 管理DB/会社DB は bootstrap で CREATE DATABASE する
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ideaquest}"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-ideaquest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ideaquest}
      CONTROL_DB_NAME: ${CONTROL_DB_NAME:-ideaquest_control}
      REDIS_URL: redis://redis:6379/0
      COOKIE_SECURE: "false"           # ローカルは HTTP のため false（本番は true）
      APP_ENV: dev
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      BACKEND_ORIGIN: http://backend:8000   # /api/v1/* をここへプロキシ（next.config）
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend

volumes:
  db_data:
