# ローカル開発用オーケストレーション（認証スライス）
# Postgres / Redis / MailHog / backend / worker / frontend。
# MinIO / PGroonga は後続スライスで追加する。
#
# 常駐ワーカ（worker / mail-worker）は profile `workers` に隔離する（既定の `docker compose up` では起動しない）。
# 理由＝両ワーカは共有 control DB の *_outbox を real sender で drain するため、backend の pytest（プロセス内
# FakeMailSender で同じ mail_outbox を drain する）と同時に走ると mail 行の取り合いになり mail 系 TC がフレーク化する
# （mail_worker.py の docstring「テストは直接呼ぶ＝常駐不要」）。
#   ・backend pytest（`up -d db redis`）＝ワーカ不要（既定のままで安全＝mail 競合が起きない）。
#   ・非同期を要する frontend e2e＝**`docker compose --profile workers up -d` が必要**。sc-00-mfa/password-setup は
#     OTP/設定リンクの MailHog 配信（mail-worker）に、sc-90 のディレクトリ参加追加は会社DB users ミラー
#     （account_sync worker）に依存する。ワーカ非依存の e2e（sc-91 等）は既定の `up` でも動く。
#   ・注意＝`--profile workers` で mail-worker を上げたまま backend pytest を回すと mail 競合が再発する（上記理由）。
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ideaquest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ideaquest}
      POSTGRES_DB: postgres            # 管理DB/会社DB は bootstrap で CREATE DATABASE する
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ideaquest}"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  mailhog:
    image: mailhog/mailhog
    ports:
      - "${MAILHOG_SMTP_PORT:-1025}:1025"   # SMTP（backend が送信）
      - "${MAILHOG_UI_PORT:-8025}:8025"     # Web UI（受信メール確認）

  # オブジェクトストレージ（画像/添付・API設計 §1.10）。非公開バケット＝backend が短TTL署名URLを発行。
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-ideaquest}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-ideaquest-secret}
    ports:
      - "${MINIO_PORT:-9000}:9000"          # S3 API（ブラウザが署名URLを叩く＝public_endpoint）
      - "${MINIO_CONSOLE_PORT:-9001}:9001"  # 管理コンソール
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment: &backend_env
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-ideaquest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ideaquest}
      CONTROL_DB_NAME: ${CONTROL_DB_NAME:-ideaquest_control}
      REDIS_URL: redis://redis:6379/0
      COOKIE_SECURE: "false"           # ローカルは HTTP のため false（本番は true）
      APP_ENV: dev
      # メール送信（置き場所は env=ADR-0003）。dev は MailHog（認証なし・平文）＝既定でそのまま動く
      SMTP_HOST: ${SMTP_HOST:-mailhog}       # PW設定リンクの送信先（ADR-0002 §2.5）
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}              # 秘匿（本番はシークレットマネージャ供給・dev は空）
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}      # 秘匿（同上）
      SMTP_START_TLS: ${SMTP_START_TLS:-false}   # 本番 587 送信で true・MailHog は false
      MAIL_FROM: ${MAIL_FROM:-no-reply@ideaquest.example}
      MAIL_ALERT_TO: ${MAIL_ALERT_TO:-alerts@ideaquest.example}   # 運用/システムアラート宛先
      APP_BASE_URL: http://localhost:3000   # メールリンクの基点（フロントの password-setup ページ）
      # MFA（メールOTP）・信頼端末のしきい値（ADR-0004・env で調整可）
      OTP_LENGTH: ${OTP_LENGTH:-6}
      OTP_MAX_ATTEMPTS: ${OTP_MAX_ATTEMPTS:-5}
      OTP_TTL_SECONDS: ${OTP_TTL_SECONDS:-600}
      OTP_RESEND_COOLDOWN_SECONDS: ${OTP_RESEND_COOLDOWN_SECONDS:-30}
      PREAUTH_TTL_SECONDS: ${PREAUTH_TTL_SECONDS:-600}
      TRUSTED_DEVICE_TTL_SECONDS: ${TRUSTED_DEVICE_TTL_SECONDS:-2592000}
      # ログイン試行レート制限（ADR-0005・IP+login_id/窓）。dev/e2e は直列で同一 OPS 管理者へ多数ログインするため既定 10 では自己スロットルする→ヘッドルームを確保（prod は別 env で不変）。
      LOGIN_RATE_LIMIT_MAX: ${LOGIN_RATE_LIMIT_MAX:-50}
      LOGIN_RATE_LIMIT_WINDOW_SECONDS: ${LOGIN_RATE_LIMIT_WINDOW_SECONDS:-300}
      # アカウント一時ロック（ADR-0005・env で調整可）
      LOGIN_LOCK_MAX_ATTEMPTS: ${LOGIN_LOCK_MAX_ATTEMPTS:-5}
      LOGIN_LOCK_TTL_SECONDS: ${LOGIN_LOCK_TTL_SECONDS:-900}
      LOGIN_LOCK_NOTIFY_COOLDOWN_SECONDS: ${LOGIN_LOCK_NOTIFY_COOLDOWN_SECONDS:-3600}
      # クライアント IP の確定（ADR-0006・本番はエッジ段数に一致）
      TRUSTED_PROXY_COUNT: ${TRUSTED_PROXY_COUNT:-0}
      # account_sync_outbox ワーカ（データモデル §4.6）
      OUTBOX_MAX_ATTEMPTS: ${OUTBOX_MAX_ATTEMPTS:-5}
      OUTBOX_POLL_INTERVAL_SECONDS: ${OUTBOX_POLL_INTERVAL_SECONDS:-1.0}
      # mail_outbox ワーカ（認証系メール非同期・ADR-0007・mail_worker）
      MAIL_OUTBOX_MAX_ATTEMPTS: ${MAIL_OUTBOX_MAX_ATTEMPTS:-5}
      MAIL_OUTBOX_POLL_INTERVAL_SECONDS: ${MAIL_OUTBOX_POLL_INTERVAL_SECONDS:-1.0}
      MAIL_OUTBOX_SENDING_RECLAIM_SECONDS: ${MAIL_OUTBOX_SENDING_RECLAIM_SECONDS:-60}
      MAIL_OUTBOX_DONE_RETENTION_SECONDS: ${MAIL_OUTBOX_DONE_RETENTION_SECONDS:-604800}
      # メール変更のダブルオプトイン確認リンク TTL（ADR-0008・24h・単回）
      EMAIL_CHANGE_TTL_SECONDS: ${EMAIL_CHANGE_TTL_SECONDS:-86400}
      # ブートストラップ（運営テナント＋初期 system_admin・API設計 B.5.1）
      OPS_COMPANY_CODE: ${OPS_COMPANY_CODE:-OPS}
      BOOTSTRAP_ADMIN_LOGIN: ${BOOTSTRAP_ADMIN_LOGIN:-admin@ops.example}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@ops.example}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-Passw0rd!}   # dev 供給・本番は必ず強い秘密を供給
      # オブジェクトストレージ（MinIO・画像/添付・§1.10）。endpoint＝内部（put/remove）、public＝署名URLのホスト。
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-localhost:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-ideaquest}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-ideaquest-secret}
      MINIO_BUCKET: ${MINIO_BUCKET:-ideaquest}
      MINIO_SECURE: ${MINIO_SECURE:-false}
      MINIO_URL_TTL_SECONDS: ${MINIO_URL_TTL_SECONDS:-300}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailhog:
        condition: service_started
      minio:
        condition: service_started

  # account_sync_outbox 常駐ワーカ（管理DB→会社DB users ミラー・§4.6・両プレーンを跨ぐ唯一の実行主体）。
  # backend と同一イメージ。bootstrap/uvicorn は起動せず worker ループのみ実行（entrypoint を上書き）。
  worker:
    build: ./backend
    profiles: ["workers"]   # 既定 up からは除外（理由＝冒頭コメント）。`--profile workers up` で起動。
    environment: *backend_env
    entrypoint: ["python", "-m", "app.worker"]
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started

  # mail_outbox 常駐ワーカ（認証系メール非同期送信・ADR-0007・別プロセスで account_sync から障害隔離）。
  # backend と同一イメージ。entrypoint を上書きして mail_worker ループのみ実行。
  mail-worker:
    build: ./backend
    profiles: ["workers"]   # 既定 up からは除外（理由＝冒頭コメント）。`--profile workers up` で起動。
    environment: *backend_env
    entrypoint: ["python", "-m", "app.mail_worker"]
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started
      mailhog:
        condition: service_started

  frontend:
    build: ./frontend
    environment:
      BACKEND_ORIGIN: http://backend:8000   # /api/v1/* をここへプロキシ（next.config）
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend

volumes:
  db_data:
  minio_data:
