# ローカル開発用オーケストレーション（認証スライス）
# Postgres / Redis / MailHog / backend / frontend。
# MinIO / PGroonga / outbox worker は後続スライスで追加する。
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ideaquest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ideaquest}
      POSTGRES_DB: postgres            # 管理DB/会社DB は bootstrap で CREATE DATABASE する
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ideaquest}"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  mailhog:
    image: mailhog/mailhog
    ports:
      - "${MAILHOG_SMTP_PORT:-1025}:1025"   # SMTP（backend が送信）
      - "${MAILHOG_UI_PORT:-8025}:8025"     # Web UI（受信メール確認）

  backend:
    build: ./backend
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-ideaquest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ideaquest}
      CONTROL_DB_NAME: ${CONTROL_DB_NAME:-ideaquest_control}
      REDIS_URL: redis://redis:6379/0
      COOKIE_SECURE: "false"           # ローカルは HTTP のため false（本番は true）
      APP_ENV: dev
      # メール送信（置き場所は env=ADR-0003）。dev は MailHog（認証なし・平文）＝既定でそのまま動く
      SMTP_HOST: ${SMTP_HOST:-mailhog}       # PW設定リンクの送信先（ADR-0002 §2.5）
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}              # 秘匿（本番はシークレットマネージャ供給・dev は空）
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}      # 秘匿（同上）
      SMTP_START_TLS: ${SMTP_START_TLS:-false}   # 本番 587 送信で true・MailHog は false
      MAIL_FROM: ${MAIL_FROM:-no-reply@ideaquest.example}
      MAIL_ALERT_TO: ${MAIL_ALERT_TO:-alerts@ideaquest.example}   # 運用/システムアラート宛先
      APP_BASE_URL: http://localhost:3000   # メールリンクの基点（フロントの password-setup ページ）
      # MFA（メールOTP）・信頼端末のしきい値（ADR-0004・env で調整可）
      OTP_MAX_ATTEMPTS: ${OTP_MAX_ATTEMPTS:-5}
      OTP_TTL_SECONDS: ${OTP_TTL_SECONDS:-600}
      OTP_RESEND_COOLDOWN_SECONDS: ${OTP_RESEND_COOLDOWN_SECONDS:-30}
      PREAUTH_TTL_SECONDS: ${PREAUTH_TTL_SECONDS:-600}
      TRUSTED_DEVICE_TTL_SECONDS: ${TRUSTED_DEVICE_TTL_SECONDS:-2592000}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailhog:
        condition: service_started

  frontend:
    build: ./frontend
    environment:
      BACKEND_ORIGIN: http://backend:8000   # /api/v1/* をここへプロキシ（next.config）
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend

volumes:
  db_data:
