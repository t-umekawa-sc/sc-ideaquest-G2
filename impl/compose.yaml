# ローカル開発用オーケストレーション（認証スライス）
# Postgres / Redis / MailHog / backend / worker / frontend。
# MinIO / PGroonga は後続スライスで追加する。
#
# 常駐ワーカ（worker / mail-worker）は profile `workers` に隔離する（既定の `docker compose up` では起動しない）。
# 理由＝両ワーカは共有 control DB の *_outbox を real sender で drain するため、backend の pytest（プロセス内
# FakeMailSender で同じ mail_outbox を drain する）と同時に走ると mail 行の取り合いになり mail 系 TC がフレーク化する
# （mail_worker.py の docstring「テストは直接呼ぶ＝常駐不要」）。
#   ・backend pytest（`up -d db redis`）＝ワーカ不要（既定のままで安全＝mail 競合が起きない）。
#   ・非同期を要する frontend e2e＝**`docker compose --profile workers up -d` が必要**。sc-00-mfa/password-setup は
#     OTP/設定リンクの MailHog 配信（mail-worker）に、sc-90 のディレクトリ参加追加は会社DB users ミラー
#     （account_sync worker）に依存する。ワーカ非依存の e2e（sc-91 等）は既定の `up` でも動く。
#   ・注意＝`--profile workers` で mail-worker を上げたまま backend pytest を回すと mail 競合が再発する（上記理由）。
services:
  db:
    build:
      context: ./db          # PGroonga 同梱のカスタム Postgres16（全文検索・データモデル §6・J）
    image: ideaquest-db-pgroonga:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ideaquest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ideaquest}
      POSTGRES_DB: postgres            # 管理DB/会社DB は bootstrap で CREATE DATABASE する
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ideaquest}"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  mailhog:
    image: mailhog/mailhog
    ports:
      - "${MAILHOG_SMTP_PORT:-1025}:1025"   # SMTP（backend が送信）
      - "${MAILHOG_UI_PORT:-8025}:8025"     # Web UI（受信メール確認）

  # オブジェクトストレージ（画像/添付・API設計 §1.10）。非公開バケット＝backend が短TTL署名URLを発行。
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-ideaquest}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-ideaquest-secret}
    ports:
      - "${MINIO_PORT:-9000}:9000"          # S3 API（ブラウザが署名URLを叩く＝public_endpoint）
      - "${MINIO_CONSOLE_PORT:-9001}:9001"  # 管理コンソール
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment: &backend_env
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-ideaquest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ideaquest}
      CONTROL_DB_NAME: ${CONTROL_DB_NAME:-ideaquest_control}
      REDIS_URL: redis://redis:6379/0
      COOKIE_SECURE: "false"           # ローカルは HTTP のため false（本番は true）
      APP_ENV: dev
      # e2e 並列隔離＝ワーカ別会社DB（ACME-W0..）を N 社 seed（既定0＝通常スタックは不変・iqe2e のみ立てる）。
      E2E_WORKER_COMPANIES: ${E2E_WORKER_COMPANIES:-0}
      # メール送信（置き場所は env=ADR-0003）。dev は MailHog（認証なし・平文）＝既定でそのまま動く
      SMTP_HOST: ${SMTP_HOST:-mailhog}       # PW設定リンクの送信先（ADR-0002 §2.5）
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}              # 秘匿（本番はシークレットマネージャ供給・dev は空）
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}      # 秘匿（同上）
      SMTP_START_TLS: ${SMTP_START_TLS:-false}   # 本番 587 送信で true・MailHog は false
      MAIL_FROM: ${MAIL_FROM:-no-reply@ideaquest.example}
      MAIL_ALERT_TO: ${MAIL_ALERT_TO:-alerts@ideaquest.example}   # 運用/システムアラート宛先
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}   # メールリンクの基点（フロントの password-setup ページ・iqe2e は 3100）
      # ブラウザ Origin 許可リスト（CSRF/Origin 検証・core/deps.py・realtime）。既定 3000/8000。
      # iqe2e 隔離スタックは別ポート（3100/8100）で動くため env で上書きする（JSON 配列文字列）。
      ALLOWED_ORIGINS: '${ALLOWED_ORIGINS:-["http://localhost:3000","http://localhost:8000"]}'
      # MFA（メールOTP）・信頼端末のしきい値（ADR-0004・env で調整可）
      OTP_LENGTH: ${OTP_LENGTH:-6}
      OTP_MAX_ATTEMPTS: ${OTP_MAX_ATTEMPTS:-5}
      OTP_TTL_SECONDS: ${OTP_TTL_SECONDS:-600}
      OTP_RESEND_COOLDOWN_SECONDS: ${OTP_RESEND_COOLDOWN_SECONDS:-30}
      PREAUTH_TTL_SECONDS: ${PREAUTH_TTL_SECONDS:-600}
      TRUSTED_DEVICE_TTL_SECONDS: ${TRUSTED_DEVICE_TTL_SECONDS:-2592000}
      # セルフサインアップ（FR-48②）。既定は安全側（空/false）＝未設定なら現行挙動のまま。本番/検証で設定。
      IQ_DEFAULT_COMPANY_CODE: ${IQ_DEFAULT_COMPANY_CODE:-}                   # 既定会社コード（public デプロイのみ・会社コード欄を隠す・§8.1）
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}                            # CAPTCHA site key（公開・空で無効）
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}                        # CAPTCHA secret（秘匿・空で無効）
      HIBP_ENABLED: ${HIBP_ENABLED:-false}                                  # 漏洩PW拒否 HIBP（prod で true・外部 range API）
      SIGNUP_DISPOSABLE_EMAIL_BLOCK: ${SIGNUP_DISPOSABLE_EMAIL_BLOCK:-true}  # 使い捨てメール拒否（ローカル blocklist・既定 ON）
      SIGNUP_ADMIN_NOTIFY_ENABLED: ${SIGNUP_ADMIN_NOTIFY_ENABLED:-false}     # 新規登録の管理者通知（prod で true）
      # ログイン試行レート制限（ADR-0005・IP+login_id/窓）。dev/e2e は直列で同一 OPS 管理者へ多数ログインするため既定 10 では自己スロットルする→ヘッドルームを確保（prod は別 env で不変）。
      LOGIN_RATE_LIMIT_MAX: ${LOGIN_RATE_LIMIT_MAX:-50}
      LOGIN_RATE_LIMIT_WINDOW_SECONDS: ${LOGIN_RATE_LIMIT_WINDOW_SECONDS:-300}
      # アカウント一時ロック（ADR-0005・env で調整可）
      LOGIN_LOCK_MAX_ATTEMPTS: ${LOGIN_LOCK_MAX_ATTEMPTS:-5}
      LOGIN_LOCK_TTL_SECONDS: ${LOGIN_LOCK_TTL_SECONDS:-900}
      LOGIN_LOCK_NOTIFY_COOLDOWN_SECONDS: ${LOGIN_LOCK_NOTIFY_COOLDOWN_SECONDS:-3600}
      # クライアント IP の確定（ADR-0006・本番はエッジ段数に一致）
      TRUSTED_PROXY_COUNT: ${TRUSTED_PROXY_COUNT:-0}
      # account_sync_outbox ワーカ（データモデル §4.6）
      OUTBOX_MAX_ATTEMPTS: ${OUTBOX_MAX_ATTEMPTS:-5}
      OUTBOX_POLL_INTERVAL_SECONDS: ${OUTBOX_POLL_INTERVAL_SECONDS:-1.0}
      # mail_outbox ワーカ（認証系メール非同期・ADR-0007・mail_worker）
      MAIL_OUTBOX_MAX_ATTEMPTS: ${MAIL_OUTBOX_MAX_ATTEMPTS:-5}
      MAIL_OUTBOX_POLL_INTERVAL_SECONDS: ${MAIL_OUTBOX_POLL_INTERVAL_SECONDS:-1.0}
      MAIL_OUTBOX_SENDING_RECLAIM_SECONDS: ${MAIL_OUTBOX_SENDING_RECLAIM_SECONDS:-60}
      MAIL_OUTBOX_DONE_RETENTION_SECONDS: ${MAIL_OUTBOX_DONE_RETENTION_SECONDS:-604800}
      # メール変更のダブルオプトイン確認リンク TTL（ADR-0008・24h・単回）
      EMAIL_CHANGE_TTL_SECONDS: ${EMAIL_CHANGE_TTL_SECONDS:-86400}
      # ブートストラップ（運営テナント＋初期 system_admin・API設計 B.5.1）
      OPS_COMPANY_CODE: ${OPS_COMPANY_CODE:-OPS}
      BOOTSTRAP_ADMIN_LOGIN: ${BOOTSTRAP_ADMIN_LOGIN:-admin@ops.example}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@ops.example}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-Passw0rd!}   # dev 供給・本番は必ず強い秘密を供給
      # オブジェクトストレージ（MinIO・画像/添付・§1.10）。endpoint＝内部（put/remove）、public＝署名URLのホスト。
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-localhost:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-ideaquest}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-ideaquest-secret}
      MINIO_BUCKET: ${MINIO_BUCKET:-ideaquest}
      MINIO_SECURE: ${MINIO_SECURE:-false}
      MINIO_URL_TTL_SECONDS: ${MINIO_URL_TTL_SECONDS:-300}
      # システムログ（JSONL・ファイル日次ローテーション・doc/本番デプロイ要件.md §6.6）。
      # dev は ./logs バインドマウント（gitignore・消えて可）。prod は永続ボリューム/ホストパスに差し替える。
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      LOG_TO_FILE: ${LOG_TO_FILE:-true}
      LOG_DIR: ${LOG_DIR:-/var/log/ideaquest}
      LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-30}
      # 経営資料整合の意味的一致（A-2・FR-44）＝埋め込みを LLM 基盤の OpenAI 互換 /embeddings で取得。
      # 既定は compose 内 Ollama（profile `ai` で起動）。未起動でも best-effort＝keyword フォールバックで動く。
      # モデル/宛先は env で差し替え（prod=自社 vLLM／将来クラウド）。
      ALIGNMENT_EMBED_BASE_URL: ${ALIGNMENT_EMBED_BASE_URL:-http://ollama:11434/v1}
      ALIGNMENT_EMBED_MODEL: ${ALIGNMENT_EMBED_MODEL:-bge-m3}
      ALIGNMENT_EMBED_API_KEY: ${ALIGNMENT_EMBED_API_KEY:-}
      ALIGNMENT_EMBED_TIMEOUT_SECONDS: ${ALIGNMENT_EMBED_TIMEOUT_SECONDS:-15.0}
      # LLM ゲートウェイ（生成・AIジョブ基盤・FR-45）＝OpenAI 互換 chat。既定は compose 内 Ollama（profile `ai`）。
      # 未起動なら AIジョブは LLMUnavailable→リトライ/failed（業務は止めない）。prod は自社 vLLM 等に差し替え。
      LLM_BASE_URL: ${LLM_BASE_URL:-http://ollama:11434/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-120.0}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-0}                 # 生成トークンのグローバル上限（0=無制限・会社別上限 S.5 の技術ガード）
      LLM_MODEL_LIGHT: ${LLM_MODEL_LIGHT:-qwen3:4b}        # 論理キー qwen3-light の物理（軽量・info_summarize 既定）
      LLM_MODEL_SWALLOW: ${LLM_MODEL_SWALLOW:-hf.co/tokyotech-llm/Llama-3.1-Swallow-8B}  # 高品質日本語・iso_generate
      LLM_WORKER_CONCURRENCY: ${LLM_WORKER_CONCURRENCY:-1}            # 同時実行 N（最小スペック＝1件ずつ）
      LLM_WORKER_POLL_INTERVAL_SECONDS: ${LLM_WORKER_POLL_INTERVAL_SECONDS:-2.0}
      LLM_JOB_MAX_ATTEMPTS: ${LLM_JOB_MAX_ATTEMPTS:-3}               # 失敗リトライ上限（超で failed）
      LLM_JOB_RUNNING_RECLAIM_SECONDS: ${LLM_JOB_RUNNING_RECLAIM_SECONDS:-300}  # running 無更新の孤児回収閾値
      # アイデア公開時の AI 自動評価（FR-50・⑥）。既定 OFF＝LLM 基盤が無い環境では投入しない。
      # true かつ `--profile ai llm-worker` 起動＋会社でモデル ON のとき、published で idea_evaluate を自動投入。
      LLM_AUTO_EVALUATE_ON_PUBLISH: ${LLM_AUTO_EVALUATE_ON_PUBLISH:-false}
      # AI 評価の RAG（経営資料の意味的追補・⑥）。top-k 件数・selected+topk の合計上限・採用する最小 cosine。
      EVAL_RAG_STRATEGY_TOPK: ${EVAL_RAG_STRATEGY_TOPK:-3}
      EVAL_RAG_STRATEGY_TOTAL: ${EVAL_RAG_STRATEGY_TOTAL:-5}
      EVAL_RAG_STRATEGY_MIN_COSINE: ${EVAL_RAG_STRATEGY_MIN_COSINE:-0.45}
      # おすすめクエスト選出（④・SC-01 Zone D）の加重和の重み・直近活発の集計窓・件数上限（env で調整可）。
      RECOMMEND_WEIGHT_ALIGN: ${RECOMMEND_WEIGHT_ALIGN:-0.45}
      RECOMMEND_WEIGHT_ACTIVE: ${RECOMMEND_WEIGHT_ACTIVE:-0.35}
      RECOMMEND_WEIGHT_ADMIN: ${RECOMMEND_WEIGHT_ADMIN:-0.20}
      RECOMMEND_ACTIVE_WINDOW_DAYS: ${RECOMMEND_ACTIVE_WINDOW_DAYS:-30}
      RECOMMEND_DEFAULT_LIMIT: ${RECOMMEND_DEFAULT_LIMIT:-3}
      RECOMMEND_MAX_LIMIT: ${RECOMMEND_MAX_LIMIT:-10}
      # 帳票・レポート（ドメインV・JasperReports 疎結合連携・API設計 V.4）。dev 既定は jasper（下の jasper
      # サービスへ内部 network で到達）。Jasper 無しでも動かすなら fallback、機能オフは none。
      # S2S 秘密は dev=env（既存の SMTP 等と同様）／本番は compose `secrets:` ファイルマウントへ（設計 §17.5 G1）。
      REPORT_RENDERER: ${REPORT_RENDERER:-jasper}
      JASPER_BASE_URL: ${JASPER_BASE_URL:-http://jasper:8000}
      JASPER_TIMEOUT_SECONDS: ${JASPER_TIMEOUT_SECONDS:-30}
      JASPER_SHARED_SECRET: ${JASPER_SHARED_SECRET:-dev-jasper-secret}
    volumes:
      - ./logs:/var/log/ideaquest   # ホスト impl/logs にログを出力（gitignore・解析用）。prod は永続先へ。
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    networks:
      - default       # db/redis/minio/frontend 等（既存の相互到達を維持）
      - jasper_net     # 内部専用＝Jasper への到達はここだけ（G2・外部隔離）
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailhog:
        condition: service_started
      minio:
        condition: service_started
      # jasper は depends_on に入れない＝疎結合（Jasper 停止でも backend は起動・該当機能のみ 502/非活性）。

  # account_sync_outbox 常駐ワーカ（管理DB→会社DB users ミラー・§4.6・両プレーンを跨ぐ唯一の実行主体）。
  # backend と同一イメージ。bootstrap/uvicorn は起動せず worker ループのみ実行（entrypoint を上書き）。
  worker:
    build: ./backend
    profiles: ["workers"]   # 既定 up からは除外（理由＝冒頭コメント）。`--profile workers up` で起動。
    environment: *backend_env
    entrypoint: ["python", "-m", "app.worker"]
    volumes:
      - ./logs:/var/log/ideaquest   # worker.jsonl を出力（backend と同一ディレクトリ）。
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started

  # mail_outbox 常駐ワーカ（認証系メール非同期送信・ADR-0007・別プロセスで account_sync から障害隔離）。
  # backend と同一イメージ。entrypoint を上書きして mail_worker ループのみ実行。
  mail-worker:
    build: ./backend
    profiles: ["workers"]   # 既定 up からは除外（理由＝冒頭コメント）。`--profile workers up` で起動。
    environment: *backend_env
    entrypoint: ["python", "-m", "app.mail_worker"]
    volumes:
      - ./logs:/var/log/ideaquest   # mail-worker.jsonl を出力（backend と同一ディレクトリ）。
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started
      mailhog:
        condition: service_started

  # AIジョブ常駐ワーカ（LLM 生成・FR-45・設計 §5.2(a)・別プロセスで障害隔離）。会社DBの ai_jobs(queued)
  # を巡回し FOR UPDATE SKIP LOCKED で N 件だけ running にして LLM ゲートウェイで実行する。実生成には LLM
  # 基盤（ollama・profile ai）が要る（未起動なら LLMUnavailable→リトライ/failed）。backend と同一イメージ。
  llm-worker:
    build: ./backend
    profiles: ["workers"]   # 既定 up からは除外（理由＝冒頭コメント）。`--profile workers up` で起動。
    environment: *backend_env
    entrypoint: ["python", "-m", "app.llm_worker"]
    volumes:
      - ./logs:/var/log/ideaquest   # llm-worker.jsonl を出力（backend と同一ディレクトリ）。
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started

  frontend:
    build: ./frontend
    environment:
      BACKEND_ORIGIN: http://backend:8000   # /api/v1/* をここへプロキシ（next.config）
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend

  # ローカル LLM 基盤（OpenAI 互換・意味的一致の埋め込み用・A-2・FR-44）。profile `ai` で opt-in
  # （既定 up からは除外＝モデル取得の重さを既定に持ち込まない）。起動後に埋め込みモデルを pull する:
  #   docker compose --profile ai up -d ollama
  #   docker compose exec ollama ollama pull bge-m3
  # 未起動でも backend は best-effort で keyword フォールバック（整合率は出る）。将来のフル LLM ゲートウェイ
  # （生成・AIジョブ基盤）は別途。ここは埋め込みエンドポイントの提供のみ。
  ollama:
    image: ollama/ollama:latest
    profiles: ["ai"]
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama

  # 帳票レンダリングサービス（ドメインV・JasperReports・設計 §10/§17）。内部 S2S 専用＝公開ポートを張らず
  # `jasper_net`（internal）にのみ接続＝到達できるのは backend だけ（G2・外部隔離／SSRF 面の縮小）。
  # Java(JasperReports)＋Python(FastAPI)。jrxml はイメージにベイク（volumes 無し＝backend と同方針）。
  jasper:
    build: ./jasper
    environment:
      # S2S 共有シークレット（backend と一致・dev は env／本番は secrets ファイルマウントへ・設計 §17.5 G1）。
      JASPER_SHARED_SECRET: ${JASPER_SHARED_SECRET:-dev-jasper-secret}
    networks:
      - jasper_net   # internal のみ＝インターネット/他サービスへ到達不可（公開ポートも張らない）
    # ヘルスチェックは Dockerfile の HEALTHCHECK を使用（/health を標準ライブラリで叩く）。

volumes:
  db_data:
  minio_data:
  ollama_data:

networks:
  default:
  # 内部専用ネットワーク（外部到達不可）＝backend ↔ jasper の S2S 経路を隔離する（設計 §17.5 G2）。
  jasper_net:
    internal: true
