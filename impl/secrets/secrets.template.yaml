# デプロイ秘密の構造テンプレート（SOPS 暗号化前・D6・設計 §2 (A) デプロイ秘密）。
# これは「鍵名の一覧＋プレースホルダ」であって実値ではない（Git 追跡可）。
#
# 使い方（環境ごとに1回）:
#   1. 本ファイルをコピーし実値を記入（平文は一時的・コミットしない）。
#   2. cd impl && sops --encrypt <記入済み>.yaml > secrets/secrets.enc.yaml  （.sops.yaml の公開鍵宛てに暗号化）
#   3. secrets.enc.yaml を環境の配布経路へ（暗号文なので安全）。平文の記入済みファイルは破棄。
#
# 鍵名＝backend の設定フィールド名（app/core/config.py）／jasper は jasper_shared_secret。
# decrypt-secrets.sh がこの各キーを復号先ディレクトリ（本番は tmpfs）に `<鍵名>` ファイルとして materialize し、
# backend は secrets_dir(/run/secrets) で file>env に読む。compose.secrets.yaml が file マウントする消費者のみ即時有効
# （現状 jasper_shared_secret）。他は消費者トポロジに応じて段階結線（本番デプロイ要件 §3.1）。

jasper_shared_secret: CHANGE_ME_strong_random_s2s_secret_min_32_chars
postgres_password: CHANGE_ME_db_password
minio_access_key: CHANGE_ME_minio_user
minio_secret_key: CHANGE_ME_minio_secret
bootstrap_admin_password: CHANGE_ME_initial_system_admin_password
smtp_password: CHANGE_ME_smtp_password
turnstile_secret_key: CHANGE_ME_or_leave_empty_to_disable_captcha
llm_api_key: CHANGE_ME_or_leave_empty
alignment_embed_api_key: CHANGE_ME_or_leave_empty
