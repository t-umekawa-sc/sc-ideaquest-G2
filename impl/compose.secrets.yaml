# 本番の秘密供給オーバーレイ（設計=シークレット管理(SOPS) §5・D6「(A) ファイル供給基盤」／F9）。
#
# 使い方:  docker compose -f compose.yaml -f compose.secrets.yaml up -d
#   dev は base（compose.yaml）の env だけで従来どおり動く。本オーバーレイは「本番で env をやめ
#   `/run/secrets/<name>` ファイルマウントへ切替える差分」のみ（env も残るが file が勝つ＝下記）。
#   実鍵は impl/secrets/<name>（.gitignore 済）＝impl/secrets/jasper_shared_secret.sample を複製し強い値に。
#
# 優先順位（file > env・T3 対策＝env は docker inspect/環境継承で覗ける露出面）:
#   - backend: config.py の secrets_dir ＋ settings_customise_sources で file>env。
#   - jasper : _secrets.read_secret で file>env。
#   いずれも /run/secrets/<name> を読む。base の env 既定が残っていても file が勝つので安全。
#
# 最小権限（§8）: S2S 秘密は使う backend と検証する jasper だけに配る（workers には配らない）。
#
# ★権限の重要注意（非 Swarm の docker compose）: compose は secret の `uid/gid/mode` を**無視**し、
#   ホストファイルの所有/権限のまま bind-mount する（これらは Swarm 専用）。従って権限は**ホスト側の
#   復号ファイルで決める**＝`scripts/decrypt-secrets.sh` がディレクトリ 0700＋ファイル 0444 で materialize
#   （コンテナ実行ユーザ〔jasper=10001 等〕が読めるようにし、平文は親ディレクトリ 0700＋tmpfs で守る）。
#   ここで `mode:`/`uid:` を書いても効かないため記載しない（誤解防止）。より厳格にするなら decrypt を
#   root 実行し STRICT_CHOWN_UID で 0400＋消費 uid 所有にする（本番デプロイ要件 §3.1）。
#
# ※ このオーバーレイは「env 露出面の縮小」まで。ホスト上のファイル実体は平文＝at-rest 暗号化は
#   SOPS+age（decrypt-secrets.sh＋secrets.enc.yaml）が担う（設計 §5 末尾の注意・§7 の守れる/守れない）。

secrets:
  jasper_shared_secret:
    # 実ファイル＝decrypt-secrets.sh が secrets.enc.yaml から復号して materialize する（本番は tmpfs）。
    file: ./secrets/jasper_shared_secret

services:
  backend:
    secrets:
      - jasper_shared_secret     # /run/secrets/jasper_shared_secret にマウント（backend=root ＝読める）

  jasper:
    secrets:
      - jasper_shared_secret     # 同上（jasper=10001 ＝ホストファイル 0444 なので読める）
