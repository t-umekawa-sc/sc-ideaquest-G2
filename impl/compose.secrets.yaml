# 本番の秘密供給オーバーレイ（設計=シークレット管理(SOPS) §5・D6「(A) ファイル供給基盤」／F9）。
#
# 使い方:  docker compose -f compose.yaml -f compose.secrets.yaml up -d
#   dev は base（compose.yaml）の env だけで従来どおり動く。本オーバーレイは「本番で env をやめ
#   `/run/secrets/<name>` ファイルマウントへ切替える差分」のみ（env も残るが file が勝つ＝下記）。
#   実鍵は impl/secrets/<name>（.gitignore 済）＝impl/secrets/jasper_shared_secret.sample を複製し強い値に。
#
# 優先順位（file > env・T3 対策＝env は docker inspect/環境継承で覗ける露出面）:
#   - backend: config.py の secrets_dir ＋ settings_customise_sources で file>env。
#   - jasper : _secrets.read_secret で file>env。
#   いずれも /run/secrets/<name> を読む。base の env 既定が残っていても file が勝つので安全。
#
# 最小権限（§8）: S2S 秘密は使う backend と検証する jasper だけに配る（workers には配らない）。
#
# ※ このオーバーレイは「env 露出面の縮小」まで。ホスト上のファイル実体は平文＝at-rest 暗号化は
#   SOPS+age（D6 の (A) 本体スライス）が担う（設計 §5 末尾の注意・§7 の守れる/守れない）。

secrets:
  jasper_shared_secret:
    file: ./secrets/jasper_shared_secret   # 実ファイル（.gitignore・.sample を複製して作成する）

services:
  backend:
    secrets:
      - source: jasper_shared_secret
        mode: 0400                          # 読取専用・所有者のみ（§5）。backend は root ＝読める。

  jasper:
    secrets:
      - source: jasper_shared_secret
        uid: "10001"                        # jasper の実行ユーザ（非 root・Dockerfile uid 10001）へ読取許可
        mode: 0400
